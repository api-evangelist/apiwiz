    description: >-
      APIwiz is a low-code, end-to-end API management platform enabling the complete
      API lifecycle including design, build, security, governance, observability, and
      monetization. It provides a visual API design studio, federated gateway control
      across multiple cloud environments, eBPF-powered logging, security pipeline with
      threat detection, automated compliance monitoring, and API marketplace with
      dynamic pricing models.
